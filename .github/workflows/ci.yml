name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Logics Manager
        run: python3 -m pip install logics-manager

      - name: Install dependencies
        run: npm ci

      - name: Logics docs lint (status required, informational)
        run: python3 -m logics_manager lint --require-status
        continue-on-error: true

      - name: Workflow audit strict AC (informational, non-blocking)
        run: |
          python3 -m logics_manager audit --legacy-cutoff-version 1.1.0 --group-by-doc || {
            status=$?
            echo "::notice::Workflow audit strict AC reported findings and exited with ${status}; keeping this informational check non-blocking."
          }

      - name: Workflow audit JSON (informational, non-blocking)
        run: |
          python3 -m logics_manager audit --format json || {
            status=$?
            echo "::notice::Workflow audit JSON reported findings and exited with ${status}; keeping this informational check non-blocking."
          }

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Blocking project CI
        run: npm run ci:blocking

      - name: Bundle metrics report (informational, non-blocking)
        if: ${{ success() }}
        run: npm run bundle:metrics:report
        continue-on-error: true

      - name: PWA build artifact quality gate
        run: npm run quality:pwa

      - name: UI coverage report (informational, non-blocking)
        if: ${{ success() }}
        run: npm run coverage:ui:report
        continue-on-error: true

      - name: UI slow test top-N (informational, non-blocking)
        if: ${{ success() }}
        run: npm run test:ci:ui:slow-top
        continue-on-error: true
