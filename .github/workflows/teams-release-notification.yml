name: Notify Teams on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to notify. Leave empty to use the latest release."
        required: false
        type: string

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve release details
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ toJson(github.event.release) }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "$RELEASE_EVENT" > release.json
          elif [ -n "$RELEASE_TAG_INPUT" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG_INPUT" > release.json
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          fi

          {
            echo "RELEASE_NAME=$(jq -r '.name // .tag_name' release.json)"
            echo "RELEASE_TAG=$(jq -r '.tag_name' release.json)"
            echo "RELEASE_URL=$(jq -r '.html_url' release.json)"
            echo "AUTHOR=$(jq -r '.author.login // \"unknown\"' release.json)"
          } >> "$GITHUB_ENV"

      - name: Send Teams notification
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg release_name "$RELEASE_NAME" \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg author "$AUTHOR" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "Nouvelle release publiée"
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Repo", value: $repository },
                          { title: "Release", value: $release_name },
                          { title: "Tag", value: $release_tag },
                          { title: "Auteur", value: $author }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "Voir la release",
                        url: $release_url
                      }
                    ]
                  }
                }
              ]
            }' > teams-payload.json

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"
