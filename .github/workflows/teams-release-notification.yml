name: Notify Teams on release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to notify. Leave empty to use the latest release."
        required: false
        type: string

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release details
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            release_tag="$RELEASE_TAG_INPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          else
            git fetch --tags --force
            release_tag="$(
              git tag --points-at "$WORKFLOW_HEAD_SHA" |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1
            )"
          fi

          if [ -n "${release_tag:-}" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" > release.json; then
              echo "No GitHub Release found for tag $release_tag; skipping Teams notification."
              echo "should_notify=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ ! -s release.json ]; then
            echo "No semver release tag found on CI head SHA $WORKFLOW_HEAD_SHA; skipping Teams notification."
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_notify=true" >> "$GITHUB_OUTPUT"

          {
            echo "RELEASE_NAME=$(jq -r '.name // .tag_name' release.json)"
            echo "RELEASE_TAG=$(jq -r '.tag_name' release.json)"
            echo "RELEASE_URL=$(jq -r '.html_url' release.json)"
            echo "AUTHOR=$(jq -r '.author.login // \"unknown\"' release.json)"
          } >> "$GITHUB_ENV"

      - name: Send Teams notification
        if: ${{ steps.release.outputs.should_notify == 'true' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg release_name "$RELEASE_NAME" \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg author "$AUTHOR" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "Nouvelle release validée par la CI"
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Repo", value: $repository },
                          { title: "Release", value: $release_name },
                          { title: "Tag", value: $release_tag },
                          { title: "Auteur", value: $author }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "Voir la release",
                        url: $release_url
                      }
                    ]
                  }
                }
              ]
            }' > teams-payload.json

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data @teams-payload.json \
            "$TEAMS_WEBHOOK_URL"
